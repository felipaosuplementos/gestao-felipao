<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão Felipão</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #fff; color: #0f172a; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px; text-align: center; }
  h1 { color: #1e40af; font-size: 1.3rem; }
  p { line-height: 1.5; color: #475569; }
  a { display: inline-block; margin-top: 12px; padding: 14px 22px; border-radius: 12px; background: #1d4ed8; color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Página não encontrada</h1>
  <p id="texto">Esse endereço não existe no sistema.</p>
  <a href="/gestao-felipao/">Abrir o sistema</a>
</main>
<script>
  // O lembrete de cobrança só abre por aqui quando o aparelho não usou a cópia do sistema.
  if (location.pathname.endsWith('/evento.ics')) {
    document.getElementById('titulo').textContent = 'O calendário não abriu por aqui';
    document.getElementById('texto').textContent = 'Feche esta tela, toque de novo em "⏰ Lembrar de cobrar" e use o botão "📤 Plano B: salvar em Arquivos" ou o "Google Agenda".';
  }
</script>
</body>
</html>
